name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  independence:
    name: Runtime independence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: node scripts/check-runtime-independence.mjs

  msrv:
    name: Minimum Rust 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 test --workspace --locked

  native:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Repeat Windows broker busy and remote tests against PR and base
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
          RUST_BACKTRACE: '1'
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'seatline-remote-baseline'
          git fetch --no-tags origin $env:BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch baseline' }
          git worktree add --detach $baseline $env:BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out baseline' }
          $failures = @()
          foreach ($source in @($env:GITHUB_WORKSPACE, $baseline)) {
            # Keep path-dependency artifacts from the two checkouts separate.
            $env:CARGO_TARGET_DIR = Join-Path $source 'target'
            Push-Location $source
            try {
              Write-Host "Remote stress source: $(git rev-parse HEAD)"
              cargo test -p seatline-companion --test remote --locked --no-run
              if ($LASTEXITCODE -ne 0) {
                $failures += "build: $source"
                continue
              }
              foreach ($attempt in 1..10) {
                Write-Host "Busy regression attempt $attempt"
                cargo test -p seatline-companion --test remote --locked a_broker_with_no_room_is_reported_as_busy_and_asked_again_by_the_next_request -- --exact
                if ($LASTEXITCODE -ne 0) { $failures += "busy $attempt : $source" }
              }
              foreach ($attempt in 1..3) {
                Write-Host "Full remote suite attempt $attempt"
                cargo test -p seatline-companion --test remote --locked
                if ($LASTEXITCODE -ne 0) { $failures += "remote $attempt : $source" }
              }
            } finally {
              Pop-Location
            }
          }
          if ($failures.Count -gt 0) { throw ($failures -join "`n") }
      - name: Test release
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --locked --release
      - name: Client-only companion build
        run: |
          cargo clippy -p seatline-companion --no-default-features --locked -- -D warnings
          cargo test -p seatline-companion --no-default-features --locked
      - name: Client-only build links no network or crypto stack
        if: matrix.os == 'ubuntu-latest'
        run: |
          if cargo tree -p seatline-companion --no-default-features --edges normal --locked | grep -E 'reqwest|tungstenite|rustls|aes-gcm'; then
            echo "The client-only companion build must not link the hosted transport's dependencies." >&2
            exit 1
          fi
      - name: Build companion
        run: cargo build --release --locked -p seatline-companion
      - uses: actions/upload-artifact@v4
        with:
          name: seatline-companion-${{ matrix.os }}
          path: |
            target/release/seatline-companion
            target/release/seatline-companion.exe
          if-no-files-found: error

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Generate corpus
        run: node seatline-fuzz/fuzz-support.mjs stream-corpus seatline-fuzz/corpus/stream_lines
      - name: Smoke-run stream parser
        run: |
          max_len=$(node seatline-fuzz/fuzz-support.mjs max-len stream_lines)
          cargo +nightly fuzz run --fuzz-dir seatline-fuzz stream_lines seatline-fuzz/corpus/stream_lines -- -runs=1000 -max_len="$max_len"
