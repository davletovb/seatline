name: Companion validation
on:
  pull_request:
  push:
    branches: [codex/shared-companion]
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Resolve and format development changes
        run: |
          cargo +stable generate-lockfile
          cargo +stable fmt --all
          python3 - <<'PY'
          import json,pathlib,base64,subprocess
          files=['Cargo.lock']+subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          values={p:pathlib.Path(p).read_text() for p in set(files) if p.endswith('.rs') or p=='Cargo.lock'}
          print('SEATLINE_SYNC_BEGIN'+base64.b64encode(json.dumps(values).encode()).decode()+'SEATLINE_SYNC_END')
          PY
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test relay/*.test.mjs packaging/*.test.mjs
