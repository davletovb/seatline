name: Live Claude smoke test
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label with claude installed and signed in"
        required: true
        default: "self-hosted"
      mode:
        description: "required fails if unavailable/signed out; 1 skips"
        required: true
        default: "required"
        type: choice
        options: [required, "1"]
permissions:
  contents: read
jobs:
  live:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run Seatline live test
        env:
          SEATLINE_LIVE_CLAUDE: ${{ inputs.mode }}
        run: cargo +stable test --locked -p seatline-tests --test live_claude -- --nocapture
# Uses the CLI's existing local sign-in; Seatline does not inject provider credentials.
