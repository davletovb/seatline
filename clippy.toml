# SEC-01: nothing from a request may become an executable path or a shell
# command. Only the provider process manager (core/src/process.rs, NAT-04) starts
# provider processes, through one call that explicitly allows this method, with an
# absolute executable path and an argument array. Companion startup and local
# registered worker launch have separate, documented local-authority allowances.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "only the provider process manager may start processes (SEC-01)" },
]
