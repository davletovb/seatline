[package]
name = "seatline-tests"
description = "Integration tests for the provider runtime, run against the fake provider this package builds a binary of"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "seatline-fake-provider"
path = "src/main.rs"

[dependencies]
seatline-fake-provider = { path = "../fake-provider" }

[dev-dependencies]
seatline-core = { path = "../seatline-core" }
seatline-platform = { path = "../platform" }
seatline-providers = { path = "../providers" }
seatline-scheduler = { path = "../scheduler" }
seatline-service = { path = "../service" }
serde_json = "1.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
