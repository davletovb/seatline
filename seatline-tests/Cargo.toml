[package]
name = "seatline-tests"
description = "Integration tests for the provider runtime, run against the fake provider this package builds a binary of"
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "seatline-fake-provider"
path = "src/main.rs"

[dependencies]
seatline-fake-provider = { path = "../fake-provider" }

[dev-dependencies]
# The client only: the tests start the broker binary themselves.
seatline-companion = { path = "../companion", default-features = false }
seatline-core = { path = "../seatline-core" }
seatline-platform = { path = "../platform" }
seatline-providers = { path = "../providers" }
seatline-scheduler = { path = "../scheduler" }
seatline-service = { path = "../service" }
serde_json = "1.0"
# To tell when a broker the tests started is listening.
interprocess = { version = "=2.4.4", features = ["tokio"] }
tokio = { version = "1", features = ["rt"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
